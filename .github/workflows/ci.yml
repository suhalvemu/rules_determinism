name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test rules_determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.8.5
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Build all targets
        run: bazel build //...
      - name: Run tests
        run: bazel test //...
