name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Test rules_determinism
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: bazel-contrib/setup-bazel@0.8.5
        with:
          bazelisk-cache: true
          repository-cache: true
      - name: Build all targets
        run: bazel build //...
      - name: Run tests
        run: |
          # Skip gracefully if no test targets exist yet
          TEST_TARGETS=$(bazel query 'tests(//...)' 2>/dev/null || true)
          if [ -n "$TEST_TARGETS" ]; then
            bazel test //...
          else
            echo "No test targets found — skipping (add tests to //tests/ to enable)"
          fi
